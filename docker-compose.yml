services:

  web:
    build: .
    container_name: nobatify_web

    volumes:
      - .:/app

    env_file:
    - .env.docker

    expose:
      - "8000"

    depends_on:
      db:
        condition: service_healthy
        


  db:
    image: postgres:16-alpine
    container_name: nobatify_db
    
    env_file:
        - .env.docker

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    expose:
      - "5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: nobatify_nginx

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./staticfiles:/app/staticfiles:ro

    depends_on:
      - web

volumes:
  postgres_data:
