{% extends "base.html" %} {% block title %}شارژ کیف پول | Nobatify{% endblock %}
{% block content %}

<section class="page-shell">
  <div class="mx-auto max-w-4xl">
    <!-- Header -->
    <div class="mb-8 reveal-up">
      <span class="eyebrow"> مالی </span>

      <h1 class="page-title">شارژ کیف پول</h1>

      <p class="mt-4 max-w-xl text-sm leading-7 text-[#5E3122]/55">
        مبلغ شارژ را وارد کن و سپس کارت موردنظر را انتخاب کن.
      </p>
    </div>

    <form method="post" action="{% url 'send_info_payment' %}">
      {% csrf_token %} 

      <!-- ============================= -->
      <!-- AMOUNT -->
      <!-- ============================= -->

      <div class="surface-card reveal-up p-7 mb-8">
        <div class="mb-5">
          <h2 class="text-xl font-black text-[#1D4533]">مبلغ شارژ</h2>

          <p class="mt-1 text-sm text-[#5E3122]/50">مبلغ موردنظر را وارد کن.</p>
        </div>

        <div class="field-wrap">
          <label for="balance"> مبلغ </label>

          <input
            id="balance"
            name="balance"
            type="number"
            min="1"
            step="0.01"
            placeholder="مثلاً 500000"
            required
          />

          <p class="field-help">مبلغ به تومان محاسبه می‌شود.</p>
        </div>
      </div>


      <!-- ============================= -->
      <!-- ACTIONS -->
      <!-- ============================= -->

      <div class="flex flex-wrap gap-3 reveal-up">
        <button type="submit" class="btn btn-primary">شارژ کیف پول</button>

        <a href="{% url 'wallet' %}" class="btn btn-ghost">
          بازگشت به کیف پول
        </a>
      </div>

    </form>
  </div>
</section>

{% endblock %}
